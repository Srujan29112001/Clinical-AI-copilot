apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: clinical-ai
  labels:
    app: postgres
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  clusterIP: None  # Headless service for StatefulSet
  selector:
    app: postgres

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: clinical-ai
  labels:
    app: postgres
spec:
  serviceName: postgres-service
  replicas: 1  # Use 3 for HA with replication
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
    spec:
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsNonRoot: true

      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5432
              name: postgres

          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: clinical-ai-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: clinical-ai-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clinical-ai-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: postgres-config
              mountPath: /etc/postgresql
            - name: ssl-certs
              mountPath: /var/lib/postgresql/ssl
              readOnly: true

          # HIPAA: Enable SSL/TLS
          args:
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/var/lib/postgresql/ssl/server.crt
            - -c
            - ssl_key_file=/var/lib/postgresql/ssl/server.key
            - -c
            - ssl_ca_file=/var/lib/postgresql/ssl/ca.crt
            - -c
            - ssl_min_protocol_version=TLSv1.2
            - -c
            - log_connections=on
            - -c
            - log_disconnections=on
            - -c
            - log_statement=all
            - -c
            - shared_preload_libraries=pg_stat_statements
            - -c
            - max_connections=200
            - -c
            - shared_buffers=2GB
            - -c
            - effective_cache_size=6GB
            - -c
            - maintenance_work_mem=512MB
            - -c
            - checkpoint_completion_target=0.9
            - -c
            - wal_buffers=16MB
            - -c
            - default_statistics_target=100
            - -c
            - random_page_cost=1.1

          resources:
            requests:
              cpu: "1000m"
              memory: "4Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"

          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

        # PostgreSQL Exporter for Prometheus
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:latest
          ports:
            - containerPort: 9187
              name: metrics
          env:
            - name: DATA_SOURCE_URI
              value: "localhost:5432/clinical_ai?sslmode=require"
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: clinical-ai-secrets
                  key: POSTGRES_USER
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: clinical-ai-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

      volumes:
        - name: postgres-config
          configMap:
            name: clinical-ai-config
        - name: ssl-certs
          secret:
            secretName: clinical-ai-tls
            defaultMode: 0600

  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: encrypted-ssd
        resources:
          requests:
            storage: 100Gi

---
# Backup CronJob for PostgreSQL (HIPAA compliance)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: clinical-ai
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:15-alpine
              command:
                - /bin/sh
                - -c
                - |
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="/backups/clinical_ai_${TIMESTAMP}.sql.gz"

                  echo "Starting backup at ${TIMESTAMP}"
                  pg_dump -h postgres-service -U $POSTGRES_USER $POSTGRES_DB | gzip > $BACKUP_FILE

                  echo "Encrypting backup"
                  openssl enc -aes-256-cbc -salt -in $BACKUP_FILE -out ${BACKUP_FILE}.enc -k $ENCRYPTION_KEY
                  rm $BACKUP_FILE

                  echo "Uploading to S3"
                  aws s3 cp ${BACKUP_FILE}.enc s3://$S3_BUCKET/postgres-backups/

                  echo "Cleaning up old backups (>30 days)"
                  find /backups -name "*.enc" -mtime +30 -delete

                  echo "Backup completed successfully"
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: clinical-ai-secrets
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: clinical-ai-secrets
                      key: POSTGRES_PASSWORD
                - name: POSTGRES_DB
                  valueFrom:
                    configMapKeyRef:
                      name: clinical-ai-config
                      key: POSTGRES_DB
                - name: ENCRYPTION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: clinical-ai-secrets
                      key: ENCRYPTION_KEY
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backup-secret
                      key: S3_BUCKET
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backup-secret
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backup-secret
                      key: AWS_SECRET_ACCESS_KEY
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              emptyDir: {}
