apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: clinical-ai

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - storage.yaml
  - postgres-statefulset.yaml
  - neo4j-statefulset.yaml
  - qdrant-deployment.yaml
  - kafka-statefulset.yaml
  - redis-deployment.yaml
  - clinical-ai-deployment.yaml
  - ingress.yaml
  - monitoring.yaml

commonLabels:
  project: clinical-ai-copilot
  managed-by: kustomize

commonAnnotations:
  version: "1.0.0"
  compliance: "hipaa"
