apiVersion: v1
kind: Service
metadata:
  name: qdrant-service
  namespace: clinical-ai
  labels:
    app: qdrant
spec:
  ports:
    - port: 6333
      targetPort: 6333
      name: http
    - port: 6334
      targetPort: 6334
      name: grpc
  selector:
    app: qdrant

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: clinical-ai
  labels:
    app: qdrant
spec:
  replicas: 2  # For HA
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - qdrant
                topologyKey: kubernetes.io/hostname

      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.7.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 6333
              name: http
            - containerPort: 6334
              name: grpc

          env:
            - name: QDRANT__SERVICE__GRPC_PORT
              value: "6334"
            - name: QDRANT__SERVICE__HTTP_PORT
              value: "6333"
            - name: QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS
              value: "4"
            - name: QDRANT__STORAGE__OPTIMIZERS__INDEXING_THRESHOLD
              value: "20000"

          volumeMounts:
            - name: qdrant-storage
              mountPath: /qdrant/storage

          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "8Gi"

          livenessProbe:
            httpGet:
              path: /
              port: 6333
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /readyz
              port: 6333
            initialDelaySeconds: 10
            periodSeconds: 5

      volumes:
        - name: qdrant-storage
          persistentVolumeClaim:
            claimName: qdrant-pvc
