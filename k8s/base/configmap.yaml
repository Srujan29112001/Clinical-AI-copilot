apiVersion: v1
kind: ConfigMap
metadata:
  name: clinical-ai-config
  namespace: clinical-ai
data:
  # Application Config
  APP_NAME: "Clinical AI Copilot"
  APP_VERSION: "1.0.0"
  LOG_LEVEL: "INFO"

  # API Config
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  WORKERS: "4"

  # Database URLs
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "clinical_ai"

  NEO4J_URI: "bolt://neo4j-service:7687"
  NEO4J_DATABASE: "medical_knowledge"

  QDRANT_HOST: "qdrant-service"
  QDRANT_PORT: "6333"
  QDRANT_GRPC_PORT: "6334"

  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

  # Kafka Config
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  KAFKA_EEG_TOPIC: "eeg-stream"
  KAFKA_ALERTS_TOPIC: "clinical-alerts"
  KAFKA_CONSUMER_GROUP: "clinical-ai-processor"

  # Model Config
  MODEL_PATH: "/models"
  CUDA_VISIBLE_DEVICES: "0"
  MAX_BATCH_SIZE: "4"
  USE_FP16: "true"
  USE_QUANTIZATION: "true"

  # HIPAA Config
  AUDIT_LOG_RETENTION_DAYS: "2555"
  ENCRYPTION_ENABLED: "true"

  # Monitoring
  PROMETHEUS_ENABLED: "true"
  GRAFANA_ENABLED: "true"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: clinical-ai
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'clinical-ai-api'
        static_configs:
          - targets: ['clinical-ai-service:8000']
        metrics_path: '/metrics'

      - job_name: 'postgres'
        static_configs:
          - targets: ['postgres-exporter:9187']

      - job_name: 'kafka'
        static_configs:
          - targets: ['kafka-exporter:9308']

      - job_name: 'neo4j'
        static_configs:
          - targets: ['neo4j-service:2004']

      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter:9100']

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: clinical-ai
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service:9090
        isDefault: true
        editable: false

      - name: PostgreSQL
        type: postgres
        access: proxy
        url: postgres-service:5432
        database: clinical_ai
        user: $POSTGRES_USER
        secureJsonData:
          password: $POSTGRES_PASSWORD
        jsonData:
          sslmode: require
          postgresVersion: 1500
        editable: false
