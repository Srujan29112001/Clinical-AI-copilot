apiVersion: v1
kind: Service
metadata:
  name: clinical-ai-service
  namespace: clinical-ai
  labels:
    app: clinical-ai
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
      protocol: TCP
  selector:
    app: clinical-ai

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinical-ai
  namespace: clinical-ai
  labels:
    app: clinical-ai
    version: v1.0.0
spec:
  replicas: 2  # Horizontal scaling
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero-downtime deployment

  selector:
    matchLabels:
      app: clinical-ai

  template:
    metadata:
      labels:
        app: clinical-ai
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"

    spec:
      # Security context
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      # Node affinity for GPU nodes
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu
                    operator: Exists
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: gpu.nvidia.com/class
                    operator: In
                    values:
                      - rtx-3060
                      - rtx-4090
                      - a100

        # Pod anti-affinity to spread across nodes
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - clinical-ai
                topologyKey: kubernetes.io/hostname

      # Init containers
      initContainers:
        # Wait for databases
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-service 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready"

        - name: wait-for-neo4j
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z neo4j-service 7687; do
                echo "Waiting for Neo4j..."
                sleep 2
              done
              echo "Neo4j is ready"

        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z kafka-service 9092; do
                echo "Waiting for Kafka..."
                sleep 2
              done
              echo "Kafka is ready"

        # Download models (if using model registry)
        - name: download-models
          image: amazon/aws-cli:latest
          command:
            - sh
            - -c
            - |
              if [ -z "$(ls -A /models)" ]; then
                echo "Downloading models from S3..."
                aws s3 sync s3://clinical-ai-models/ /models/ --exclude "*" --include "*.pt" --include "*.safetensors"
              else
                echo "Models already present"
              fi
          volumeMounts:
            - name: models
              mountPath: /models
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: postgres-backup-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: postgres-backup-secret
                  key: AWS_SECRET_ACCESS_KEY

      containers:
        - name: clinical-ai
          image: clinical-ai:latest  # Replace with your registry
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000
              name: http
              protocol: TCP

          # Environment variables from ConfigMap
          envFrom:
            - configMapRef:
                name: clinical-ai-config

          # Environment variables from Secrets
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: clinical-ai-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clinical-ai-secrets
                  key: POSTGRES_PASSWORD
            - name: NEO4J_USER
              valueFrom:
                secretKeyRef:
                  name: clinical-ai-secrets
                  key: NEO4J_USER
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clinical-ai-secrets
                  key: NEO4J_PASSWORD
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: clinical-ai-secrets
                  key: ENCRYPTION_KEY
            - name: AUDIT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: clinical-ai-secrets
                  key: AUDIT_ENCRYPTION_KEY
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: clinical-ai-secrets
                  key: JWT_SECRET_KEY
            - name: JWT_ALGORITHM
              valueFrom:
                secretKeyRef:
                  name: clinical-ai-secrets
                  key: JWT_ALGORITHM

          # Volume mounts
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: audit-logs
              mountPath: /var/log/clinical-ai
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm  # Shared memory for PyTorch

          # Resource limits
          resources:
            requests:
              cpu: "2000m"
              memory: "8Gi"
              nvidia.com/gpu: "1"  # Request 1 GPU
            limits:
              cpu: "8000m"
              memory: "16Gi"
              nvidia.com/gpu: "1"

          # Health checks
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 120  # Allow time for model loading
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # Startup probe for slow model loading
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30  # 5 minutes max for startup

          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL

      # Volumes
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models-pvc
        - name: audit-logs
          persistentVolumeClaim:
            claimName: audit-logs-pvc
        - name: tmp
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi  # Shared memory for DataLoader workers

      # Tolerations for GPU nodes
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clinical-ai-hpa
  namespace: clinical-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clinical-ai
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "1000"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max

---
# Pod Disruption Budget (High Availability)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clinical-ai-pdb
  namespace: clinical-ai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: clinical-ai
