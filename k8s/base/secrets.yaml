apiVersion: v1
kind: Secret
metadata:
  name: clinical-ai-secrets
  namespace: clinical-ai
type: Opaque
stringData:
  # Database Credentials
  POSTGRES_USER: "clinical_admin"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"  # Use external secrets in prod

  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

  # Encryption Keys
  ENCRYPTION_KEY: "CHANGE_ME_32_CHAR_BASE64_KEY=="  # Fernet key
  AUDIT_ENCRYPTION_KEY: "CHANGE_ME_32_CHAR_BASE64_KEY=="

  # JWT Secrets
  JWT_SECRET_KEY: "CHANGE_ME_LONG_RANDOM_STRING"
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"

  # API Keys
  OPENAI_API_KEY: "sk-CHANGE_ME"  # If using OpenAI for fallback
  HUGGINGFACE_TOKEN: "hf_CHANGE_ME"

  # Kafka SSL (if enabled)
  KAFKA_SSL_KEYSTORE_PASSWORD: "CHANGE_ME"
  KAFKA_SSL_KEY_PASSWORD: "CHANGE_ME"
  KAFKA_SSL_TRUSTSTORE_PASSWORD: "CHANGE_ME"

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-backup-secret
  namespace: clinical-ai
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
  S3_BUCKET: "clinical-ai-backups"
  S3_REGION: "us-east-1"

---
# TLS Certificate Secret (use cert-manager in production)
apiVersion: v1
kind: Secret
metadata:
  name: clinical-ai-tls
  namespace: clinical-ai
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    # REPLACE WITH ACTUAL TLS CERTIFICATE
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    # REPLACE WITH ACTUAL PRIVATE KEY
    -----END PRIVATE KEY-----
