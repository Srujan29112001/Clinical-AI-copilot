apiVersion: v1
kind: Service
metadata:
  name: vault-service
  namespace: clinical-ai
  labels:
    app: vault
spec:
  type: ClusterIP
  ports:
    - port: 8200
      targetPort: 8200
      name: api
    - port: 8201
      targetPort: 8201
      name: cluster
  selector:
    app: vault

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: clinical-ai
spec:
  serviceName: vault-service
  replicas: 3  # HA cluster
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      serviceAccountName: vault-sa
      securityContext:
        fsGroup: 1000
        runAsUser: 100
        runAsNonRoot: true

      containers:
        - name: vault
          image: hashicorp/vault:1.15
          ports:
            - containerPort: 8200
              name: api
            - containerPort: 8201
              name: cluster

          env:
            - name: VAULT_ADDR
              value: "http://127.0.0.1:8200"
            - name: VAULT_API_ADDR
              value: "http://$(POD_IP):8200"
            - name: VAULT_CLUSTER_ADDR
              value: "https://$(POD_IP):8201"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

          volumeMounts:
            - name: vault-config
              mountPath: /vault/config
            - name: vault-data
              mountPath: /vault/data
            - name: vault-tls
              mountPath: /vault/tls
              readOnly: true

          command: ["vault", "server", "-config=/vault/config/vault.hcl"]

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"

          livenessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: 8200
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
              port: 8200
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5

      volumes:
        - name: vault-config
          configMap:
            name: vault-config
        - name: vault-tls
          secret:
            secretName: clinical-ai-tls

  volumeClaimTemplates:
    - metadata:
        name: vault-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: encrypted-ssd
        resources:
          requests:
            storage: 10Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: clinical-ai
data:
  vault.hcl: |
    ui = true

    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = 1  # SSL terminated at ingress
    }

    storage "raft" {
      path    = "/vault/data"
      node_id = "${POD_NAME}"

      retry_join {
        leader_api_addr = "http://vault-0.vault-service:8200"
      }
      retry_join {
        leader_api_addr = "http://vault-1.vault-service:8200"
      }
      retry_join {
        leader_api_addr = "http://vault-2.vault-service:8200"
      }
    }

    api_addr = "http://$(POD_IP):8200"
    cluster_addr = "https://$(POD_IP):8201"

    # HIPAA: Enable audit logging
    audit "file" {
      file_path = "/vault/logs/audit.log"
    }

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-sa
  namespace: clinical-ai

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-server-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault-sa
    namespace: clinical-ai
